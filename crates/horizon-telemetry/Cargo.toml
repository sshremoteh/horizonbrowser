[package]
name = "horizon-telemetry"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.90"
description = "Opt-in data collection: the player's consent, the payloads, the local outbox and its upload"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# zstd in pure Rust: batches are compressed before they leave and checked when they arrive.
ruzstd = "0.9"
# The random install ID and outbox file names.
getrandom = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Random for the wasm target: `wasm_js` entropy from the host side.
getrandom = { version = "0.3", default-features = false, features = ["wasm_js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Sending, for the launcher (and the game's "I'm playing" ping). std net has
# no wasm target; the browser build keeps the outbox local until a fetch
# bridge replaces `upload::deliver` and `live::fetch`.
ureq = { version = "2", default-features = false, features = ["tls"] }

[features]
default = ["upload", "live"]
upload = []
# The "I'm playing" ping and reading the live count (`live`), for the game and the launcher.
live = []

[[test]]
name = "consent_gating"
required-features = ["upload"]

[lints]
workspace = true
